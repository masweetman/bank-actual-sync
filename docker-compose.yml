services:
  sync-backend:
    image: bank-actual-sync-backend:latest
    build:
      context: ./backend
    container_name: sync-backend
    restart: unless-stopped
    volumes:
      - sync-data:/app/data
    environment:
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - PLAID_CLIENT_ID=${PLAID_CLIENT_ID}
      - PLAID_SECRET=${PLAID_SECRET}
      - PLAID_ENV=${PLAID_ENV:-production}
    networks:
      - budget-net

  sync-ui:
    image: bank-actual-sync-ui:latest
    build:
      context: ./frontend
    container_name: sync-ui
    restart: unless-stopped
    ports:
      - "3081:3081"
    networks:
      - budget-net
    depends_on:
      - sync-backend

volumes:
  sync-data:

networks:
  budget-net:
    external: true
